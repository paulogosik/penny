name: penny

services:
  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        format: raw
    ports:
      - "8080:8080"
    restart: unless-stopped

  bot:
    build: ./bot
    env_file:
      - path: ./bot/.env
        format: raw
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
