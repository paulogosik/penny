spring.application.name=penny-backend
server.port=8080

# Le variaveis do arquivo backend/.env (opcional; nao falha se nao existir)
spring.config.import=optional:file:.env[.properties]

# Google Gemini — classificacao de gastos
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.model=gemini-flash-latest
gemini.api.key=${GEMINI_API_KEY:}
